<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel | PipocaCentral</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/painel.css">
</head>
<body>
<div id="boot" class="boot">Carregando painel...</div>

<section id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-logo"><span>🍿</span> PipocaCentral</div>
    <h1>Painel administrativo</h1>
    <p>Entre com a conta de administrador para continuar.</p>
    <button type="button" class="btn btn-primary btn-block" id="login-google">Entrar com o Google</button>
    <div class="divider"><span>ou com e-mail</span></div>
    <form id="login-form" novalidate>
      <div class="field"><label for="login-email">E-mail</label><input id="login-email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="login-password">Senha</label><input id="login-password" type="password" autocomplete="current-password" required></div>
      <p class="form-error" id="login-error" role="alert"></p>
      <button type="submit" class="btn btn-secondary btn-block">Entrar</button>
    </form>
  </div>
</section>

<section id="denied" class="login" hidden>
  <div class="login-card">
    <h1>Sem acesso</h1>
    <p id="denied-text">Esta conta não tem permissão para usar o painel.</p>
    <button type="button" class="btn btn-secondary btn-block" id="denied-logout">Sair e usar outra conta</button>
  </div>
</section>

<div id="shell" class="shell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a href="#/" class="brand"><span>🍿</span> Painel</a>
      <button type="button" class="icon-btn menu-close" id="menu-close" aria-label="Fechar menu">✕</button>
    </div>
    <nav id="nav" aria-label="Seções do painel"></nav>
    <div class="sidebar-foot">
      <div id="who" class="who"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="logout">Sair</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="topbar">
      <button type="button" class="icon-btn" id="menu-open" aria-label="Abrir menu">☰</button>
      <h1 id="view-title">Início</h1>
      <div id="view-actions" class="view-actions"></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
